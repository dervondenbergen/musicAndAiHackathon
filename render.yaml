services:
  # Combined Backend + AI Service
  - type: web
    name: architecture-soundscapes-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: AI_SERVICE_URL
        value: http://localhost:8000
      - key: CORS_ORIGIN
        value: "*"  # Simplified - will update manually after deployment
      - key: SOUNDS_CACHE_PATH
        value: /app/sounds_cache
      - key: MODEL_PATH
        value: /app/ai/blip
      - key: SOUNDS_CACHE_URL
        sync: false  # Set this in Render dashboard
      - key: MODEL_URL
        sync: false  # Optional
    healthCheckPath: /health

  # Frontend Static Site
  - type: static
    name: architecture-soundscapes-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://architecture-soundscapes-backend.onrender.com"  # Will update after backend deployment